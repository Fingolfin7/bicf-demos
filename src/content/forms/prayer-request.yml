title: Prayer box
intro: If you have need of prayer, fill in this form and our team will be praying for you. Your name and email are optional.
submitLabel: Send prayer request
successTitle: We'll be praying
successMessage: Your request has gone to our prayer team. They will be praying for you.
sendTo: we-are@bicf.cz
storeEntries: false
consent: I agree that the BICF prayer team may read this request. It will not be shared with anyone else.
fields:
  - label: Your prayer request
    name: request
    type: textarea
    required: true
  - label: Name
    name: name
    type: text
    width: half
  - label: Email
    name: email
    type: email
    help: Only if you'd like us to get back to you.
    width: half
